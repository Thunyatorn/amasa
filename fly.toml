# Fly.io config for Amasa (see the README, "Deploying to Fly.io"). One machine runs both processes with
# one volume, because the databases are SQLite files with a single writer: do not scale past 1.
app = "amasa-demo"          # change to a name nobody else has (fly launch can pick one)
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/amasa.db"
  PAYMENTS_DB_PATH = "/data/payments.db"
  MODEL_PROVIDER = "anthropic"
  MODEL_PLANNER = "claude-sonnet-5-5"
  MODEL_READER = "claude-haiku-4-5-20251001"
  VISA_ACCEPTANCE_ENVIRONMENT = "SANDBOX"
  PAYMENTS_MAX_DAILY_CENTS = "100000"
  # No PORT here: the start script gives the payments service its own port.
  # Secrets are set with `fly secrets set`, never in this file.

[[mounts]]
  source = "amasa_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
